<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La Grasita Store — caja, inventario y cartera. Streetwear en Cartagena." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>La Grasita Store</title>
    <style>
      html, body { margin: 0; background: #0b0b0b; color: #f6f6f4; }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        background: #0b0b0b;
        color: #f6f6f4;
        font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      }
      .boot-out { opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
      .boot-card { display: grid; justify-items: center; text-align: center; }
      .boot-lockup { width: min(280px, 78vw); }
      .boot-lockup img { display: block; width: 100%; height: auto; animation: boot-pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .boot-ring {
        position: absolute;
        inset: -12px;
        border-radius: 999px;
        border: 2px solid rgba(245, 197, 24, 0.18);
        border-top-color: #f5c518;
        animation: boot-spin 0.9s linear infinite;
      }
      .boot-name {
        margin: 22px 0 0;
        font-family: Oswald, "Arial Narrow", sans-serif;
        font-size: 42px;
        line-height: 0.9;
        letter-spacing: 0.04em;
        animation: boot-rise 0.6s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-name span { display: block; }
      .boot-kicker {
        margin: 10px 0 0;
        color: #f5c518;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        animation: boot-rise 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-label {
        margin: 22px 0 0;
        color: #a1a1a1;
        font-size: 13px;
        letter-spacing: 0.08em;
        animation: boot-rise 0.6s 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-track {
        width: 148px;
        height: 2px;
        margin-top: 16px;
        overflow: hidden;
        background: #2a2a2a;
        animation: boot-rise 0.6s 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-track span {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #f5c518, #fff6c2, #f5c518, transparent);
        animation: boot-load 1.05s ease-in-out infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-pop { from { opacity: 0; transform: scale(0.84); } to { opacity: 1; transform: none; } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes boot-load { from { transform: translateX(-130%); } to { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-lockup img, .boot-kicker, .boot-label, .boot-track, .boot-track span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-live="polite" aria-label="Cargando La Grasita Store">
      <div class="boot-card">
        <div class="boot-lockup">
          <img src="/logo.svg" alt="La Grasita Store" />
        </div>
        <p class="boot-kicker">Cartagena</p>
        <p class="boot-label">Preparando la caja</p>
        <div class="boot-track" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
